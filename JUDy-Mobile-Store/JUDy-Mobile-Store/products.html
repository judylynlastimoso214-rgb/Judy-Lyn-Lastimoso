<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | JUDy Mobile Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
  <div class="page-title"><div class="container"><h1>All Smartphones</h1><p>Search, filter and sort to find the phone that fits you.</p></div></div>
  <div class="container section">
    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search by name or brand...">
      <select id="brandFilter"></select>
      <select id="priceFilter">
        <option value="all">All Prices</option>
        <option value="0-10000">Under ₱10,000</option>
        <option value="10000-20000">₱10,000 - ₱20,000</option>
        <option value="20000-40000">₱20,000 - ₱40,000</option>
        <option value="40000-9999999">Above ₱40,000</option>
      </select>
      <select id="sortSelect">
        <option value="popularity">Sort: Popularity</option>
        <option value="low">Price: Lowest first</option>
        <option value="high">Price: Highest first</option>
        <option value="name">Name (A-Z)</option>
      </select>
    </div>
    <p id="resultCount" class="muted" style="margin-bottom:14px"></p>
    <div class="grid" id="productGrid"></div>
  </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
</body>
</html>

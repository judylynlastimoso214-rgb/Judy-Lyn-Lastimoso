<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | JUDy Mobile Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
  <div class="page-title"><div class="container"><h1>Checkout</h1></div></div>
  <div class="container section" id="checkoutWrap">
    <div id="checkoutErrors" class="alert error"></div>
    <div class="checkout-layout">
      <form id="checkoutForm" class="form-card" novalidate>
        <h3>Customer Information</h3>
        <div class="form-grid"><label>Full Name<input type="text" id="fullName" placeholder=""></label><label>Email<input type="email" id="email" placeholder=""></label><label>Contact Number<input type="tel" id="phone" placeholder="09123456789"></label></div>
        <h3>Delivery Information</h3>
        <div class="form-grid"><label>House/Building<input type="text" id="house" placeholder=""></label><label>Street<input type="text" id="street" placeholder=""></label><label>Barangay<input type="text" id="barangay" placeholder=""></label><label>City/Municipality<input type="text" id="city" placeholder=""></label><label>Province<input type="text" id="province" placeholder=""></label><label>Postal Code<input type="text" id="postal" placeholder="6000"></label></div>
        <h3>Payment Method</h3>
        <label class="pay-option"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><br>
        <label class="pay-option"><input type="radio" name="payment" value="GCash"> GCash</label><br>
        <label class="pay-option"><input type="radio" name="payment" value="Bank Transfer"> Bank Transfer</label>
        <p class="pay-note" id="paymentNote"></p>
        <button type="submit" class="btn btn-lg btn-block">Place Order</button>
      </form>
      <aside class="summary-box" id="orderSummary"></aside>
    </div>
  </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>

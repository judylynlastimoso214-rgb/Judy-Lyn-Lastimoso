<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JUDy Mobile Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-wrap">
    <div class="auth-side"><h2>JUDy</h2><p>Mobile Store</p><img src="images/banners/hero.svg" alt="Smartphones"></div>
    <div class="auth-main"><div class="auth-form">
      <h1>Login</h1><p class="sub">Enter your username and password.</p>
      <div id="formError" class="alert error"></div><div id="formSuccess" class="alert success"></div>
      <form id="loginForm" novalidate>
        <label>Username<input type="text" id="loginUsername" placeholder="Username" autocomplete="username"></label>
        <label>Password<input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password"></label>
        <button class="btn btn-block" type="submit">Login</button>
      </form>
      <p class="form-links">No account yet? <a href="register.html">Register here</a></p>
      <p class="auth-note">Admin demo: username <b>admin</b> / password <b>admin123</b></p>
    </div></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
